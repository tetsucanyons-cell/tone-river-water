name: Update River & Dam Data

on:
  schedule:
    # 5〜10分おきに自動実行 (UTC)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手動実行
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest River and Dam Data & Accumulate History
        run: |
          python fetch_data.py

      - name: Commit and Push Updated Data & History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ public/data/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update river data & history: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            # 安全にrebase pullしてからプッシュ
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No data changes detected."
          fi
